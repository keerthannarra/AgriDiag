services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agridiag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agridiag_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agridiag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
